<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1120" height="380" fill="#06090F"/>

  <!-- stage labels -->
  <text x="16" y="30" font-size="11" fill="#475569" letter-spacing="2">INPUT</text>
  <text x="226" y="30" font-size="11" fill="#475569" letter-spacing="2">RESOLVER</text>
  <text x="446" y="30" font-size="11" fill="#475569" letter-spacing="2">DATA SOURCE</text>
  <text x="716" y="30" font-size="11" fill="#475569" letter-spacing="2">BUFFER</text>
  <text x="956" y="30" font-size="11" fill="#475569" letter-spacing="2">RENDER</text>

  <!-- URL state -->
  <rect x="16" y="150" width="172" height="100" fill="#0D131F" stroke="#1E293B"/>
  <rect x="16" y="150" width="3" height="100" fill="#00E5FF"/>
  <text x="34" y="176" font-size="12" font-weight="600" fill="#F8FAFC" letter-spacing="1">nuqs URL STATE</text>
  <text x="34" y="198" font-size="11" fill="#94A3B8">siteId · metric · compare</text>
  <text x="34" y="216" font-size="11" fill="#94A3B8">range · mode</text>
  <text x="34" y="234" font-size="11" fill="#94A3B8">from · to</text>

  <!-- getDataSource -->
  <rect x="226" y="162" width="160" height="76" fill="#121A2A" stroke="#334155"/>
  <text x="246" y="192" font-size="12" font-weight="600" fill="#F8FAFC">getDataSource()</text>
  <text x="246" y="214" font-size="11" fill="#94A3B8">env mode</text>

  <!-- MockDataSource -->
  <rect x="446" y="80" width="210" height="78" fill="#0D131F" stroke="#1E293B"/>
  <rect x="446" y="80" width="3" height="78" fill="#F59E0B"/>
  <text x="464" y="106" font-size="12" font-weight="600" fill="#F8FAFC">MockDataSource</text>
  <text x="464" y="128" font-size="11" fill="#94A3B8">10k deterministic</text>
  <text x="464" y="144" font-size="11" fill="#94A3B8">wall-clock stream</text>
  <text x="446" y="74" font-size="10" fill="#F59E0B" letter-spacing="1">mode=mock / no creds</text>

  <!-- SupabaseDataSource -->
  <rect x="446" y="240" width="210" height="78" fill="#0D131F" stroke="#1E293B"/>
  <rect x="446" y="240" width="3" height="78" fill="#10B981"/>
  <text x="464" y="266" font-size="12" font-weight="600" fill="#F8FAFC">SupabaseDataSource</text>
  <text x="464" y="288" font-size="11" fill="#94A3B8">PostgREST history</text>
  <text x="464" y="304" font-size="11" fill="#94A3B8">Realtime broadcast</text>
  <text x="446" y="234" font-size="10" fill="#10B981" letter-spacing="1">mode=supabase</text>

  <!-- ring buffer -->
  <rect x="716" y="130" width="190" height="110" fill="#121A2A" stroke="#334155"/>
  <text x="734" y="156" font-size="12" font-weight="600" fill="#F8FAFC">useRef ring buffer</text>
  <text x="734" y="178" font-size="11" fill="#94A3B8">10k cap · ts dedup</text>
  <text x="734" y="196" font-size="11" fill="#00E5FF">rAF flush · 250ms</text>
  <text x="734" y="222" font-size="10" fill="#475569">zero per-point re-render</text>

  <!-- primary chart -->
  <rect x="956" y="80" width="148" height="78" fill="#0D131F" stroke="#1E293B"/>
  <rect x="956" y="80" width="3" height="78" fill="#00E5FF"/>
  <text x="972" y="106" font-size="12" font-weight="600" fill="#F8FAFC">Primary signal</text>
  <text x="972" y="128" font-size="11" fill="#94A3B8">LTTB · markLines</text>
  <text x="972" y="144" font-size="11" fill="#94A3B8">dataZoom</text>

  <!-- correlation chart -->
  <rect x="956" y="240" width="148" height="78" fill="#0D131F" stroke="#1E293B"/>
  <rect x="956" y="240" width="3" height="78" fill="#818CF8"/>
  <text x="972" y="266" font-size="12" font-weight="600" fill="#F8FAFC">Correlation</text>
  <text x="972" y="288" font-size="11" fill="#94A3B8">echarts.connect</text>
  <text x="972" y="304" font-size="11" fill="#94A3B8">synced crosshair</text>

  <!-- arrows -->
  <line x1="188" y1="200" x2="220" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M386,190 C420,190 416,119 440,119" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M386,210 C420,210 416,279 440,279" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M656,119 C690,119 682,150 710,160" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M656,279 C690,279 682,220 710,210" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="668" y="192" font-size="10" fill="#475569">zod</text>
  <text x="668" y="222" font-size="10" fill="#475569">tuples</text>
  <path d="M906,160 C930,160 926,119 950,119" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M906,210 C930,210 926,279 950,279" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
