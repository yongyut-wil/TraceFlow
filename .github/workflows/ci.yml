name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Official image ships chromium binaries + all OS deps — no apt step,
    # no browser download. Tag must track @playwright/test in package.json;
    # `playwright install` below is a no-op on match and self-heals on drift.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm test

      - run: pnpm run build

      - run: pnpm exec playwright install chromium

      - run: pnpm test:e2e
